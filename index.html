<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2084b2">
    <meta name="description" content="School Flirt — a sweet little hallway adventure.">
    <title>School Flirt</title>
    <link rel="stylesheet" href="src/styles/main.css">
  </head>
  <body>
    <main class="cabinet" aria-label="School Flirt game">
      <div class="screen-top" aria-hidden="true"></div>
      <canvas id="game" width="1100" height="550" aria-label="School Flirt. Follow the tutorial, charm classmates, collect hearts, and avoid teachers."></canvas>
      <footer class="gamebar">
        <div class="game-identity"><span class="app-icon">✿</span><span>School Flirt</span></div>
        <div class="game-actions">
          <a class="reaction like" href="#" aria-label="Like">♧</a>
          <a class="reaction dislike" href="#" aria-label="Dislike">♧</a>
          <button id="sound-toggle" class="reaction share" aria-label="Toggle sound" aria-pressed="false">◖))</button>
          <button id="fullscreen" class="reaction fullscreen" aria-label="Toggle fullscreen">⛶</button>
        </div>
      </footer>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
