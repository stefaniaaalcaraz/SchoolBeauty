<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2084b2">
    <meta name="description" content="School Flirt — a sweet little hallway adventure.">
    <title>School Flirt</title>
    <link rel="stylesheet" href="src/styles/main.css">
  </head>
  <body>
    <main class="cabinet" aria-label="School Flirt game">
      <div class="screen-top" aria-hidden="true"></div>
      <canvas id="game" width="1100" height="550" tabindex="0" aria-label="School Flirt. Use arrow keys to walk, Space to run, and click boys to charm them."></canvas>
      <footer class="gamebar">
        <div class="game-identity"><span class="app-icon">✿</span><span>School Flirt</span></div>
        <div class="sound-controls"><button id="music-toggle" aria-pressed="false">♫ Music OFF</button><button id="effects-toggle" aria-pressed="false">♪ SFX OFF</button></div>
        <div class="game-actions">
          <a class="reaction like" href="#" aria-label="Like">♧</a>
          <a class="reaction dislike" href="#" aria-label="Dislike">♧</a>
          <button class="reaction share" aria-label="Share game">•</button>
          <button id="fullscreen" class="reaction fullscreen" aria-label="Toggle fullscreen">⛶</button>
        </div>
      </footer>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
